<title id="pl-title">Pipeline de análisis conductual</title>
<desc id="pl-desc">Los cuatro módulos del pipeline: preprocesamiento, localización de los cilindros, clasificación de conducta y resultados, con las dos fallas posibles.</desc>

<text x="1145.0" y="370" text-anchor="middle" class="a">por dónde hubo movimiento</text>
<text x="1145.0" y="384" text-anchor="middle" class="a">dentro del agua</text>

<text x="365.0" y="544" text-anchor="middle" class="a">usa la región de interés</text>

<text x="625.0" y="533" text-anchor="middle" class="nm">Arma el clip de cada segundo</text>
<text x="625.0" y="551" text-anchor="middle" class="a">16 cuadros de una ventana de 4 s</text>
<rect x="250" y="666" width="230" height="68" rx="6" fill="#faf9f5" stroke="#1a1a1a" stroke-width="1"/>
<text x="365.0" y="686" text-anchor="middle" class="nm">Separa al espécimen</text>
<text x="365.0" y="704" text-anchor="middle" class="a">del fondo, en su cilindro</text>
<text x="365.0" y="718" text-anchor="middle" class="a">(diferencia y brillo)</text>
<rect x="510" y="659" width="230" height="82" rx="6" fill="#faf9f5" stroke="#1a1a1a" stroke-width="1"/>
<text x="625.0" y="679" text-anchor="middle" class="nm">Mide 15 rasgos</text>
<text x="625.0" y="697" text-anchor="middle" class="a">movimiento, postura y trayectoria</text>
<text x="625.0" y="711" text-anchor="middle" class="a">en una ventana de 4 s</text>
<text x="625.0" y="725" text-anchor="middle" class="a">centrada en cada segundo</text>
<rect x="770" y="659" width="230" height="82" rx="6" fill="#faf9f5" stroke="#1a1a1a" stroke-width="1"/>

<text x="885.0" y="697" text-anchor="middle" class="a">pataleo bajo el agua y cambio</text>
<text x="885.0" y="711" text-anchor="middle" class="a">sobre la línea de agua</text>
<text x="885.0" y="725" text-anchor="middle" class="a">se mide en el mismo clip</text>

<text x="1145.0" y="624" text-anchor="middle" class="a">red R(2+1)D-18 sobre el clip,</text>
<text x="1145.0" y="638" text-anchor="middle" class="a">más las 22 medidas</text>

<text x="1405.0" y="884" text-anchor="middle" class="a">conducta de cada segundo</text>
